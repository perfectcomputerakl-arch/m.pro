<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDOT PRO | Super Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2f8;color:#172033}
header{background:#101c35;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h2{margin:0;color:#e4bd62;font-size:21px}
button{border:0;padding:12px 16px;border-radius:7px;cursor:pointer;font-weight:bold;background:#163b72;color:#fff}
button:disabled{opacity:.6;cursor:wait}
.container{max-width:1200px;margin:auto;padding:20px}
.panel,.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
.panel{margin-top:22px}
.login-wrap{max-width:460px;margin:55px auto}
.login-wrap h1{margin-top:0;color:#101c35}
input,select{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #ccd4e0;border-radius:7px;font-size:16px;background:#fff;color:#172033}
label{font-weight:600}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.card p{color:#64748b;margin:0}
.card h2{font-size:30px;margin:8px 0 0}
.gold{background:#b98a32}.red{background:#b42318}
.tablewrap{overflow-x:auto;margin-top:15px}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:12px;border-bottom:1px solid #e5eaf0;text-align:left}
th{background:#f1f5fa}
.badge{padding:5px 9px;border-radius:20px;background:#dcfce7;color:#166534}
.expired{background:#fee2e2;color:#991b1b}
.actions button{margin:3px}
.message{margin-top:12px;font-weight:bold;overflow-wrap:anywhere}
.error{color:#b42318}.success{color:#166534}
.small{font-size:13px;color:#64748b;line-height:1.5}
#dashboard{display:none}
@media(max-width:600px){.container{padding:12px}header{padding:15px}.login-wrap{margin:25px auto}}
</style>
</head>
<body>
<header>
  <h2>MDOT PRO ADMIN</h2>
  <button id="logoutButton" style="display:none" onclick="logout()">Logout</button>
</header>

<main class="container">
  <section id="loginScreen" class="login-wrap">
    <div class="panel">
      <h1>Super Admin Login</h1>
      <p class="small">Admin Panel access ke liye Admin email aur password se sign in karein.</p>
      <form id="loginForm">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" name="email" type="email" autocomplete="username" value="mdothelp@gmail.com" required>
        <label for="adminPassword">Admin Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required>
        <button id="loginButton" class="gold" type="submit">Admin Login</button>
      </form>
      <div id="loginMessage" class="message" role="status"></div>
    </div>
  </section>

  <section id="dashboard">
    <div class="cards">
      <div class="card"><p>Total Customers</p><h2 id="total">0</h2></div>
      <div class="card"><p>Active Subscriptions</p><h2 id="active">0</h2></div>
      <div class="card"><p>Expired / Suspended</p><h2 id="expired">0</h2></div>
    </div>

    <div class="panel">
      <h2>Create New Customer</h2>
      <form id="createForm">
        <div class="formgrid">
          <div><label>Business Name</label><input name="companyName" maxlength="100" required></div>
          <div><label>Customer Email</label><input name="email" type="email" required></div>
          <div><label>Customer Password</label><input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div>
          <div><label>Subscription Plan</label><select name="plan"><option>Basic</option><option>Professional</option><option>Enterprise</option></select></div>
          <div><label>Validity Days</label><select name="days"><option value="30">30 Days</option><option value="90">90 Days</option><option value="365">365 Days</option></select></div>
        </div>
        <button class="gold" id="createButton" type="submit">Create Customer</button>
      </form>
      <div id="createMessage" class="message" role="status"></div>
    </div>

    <div class="panel">
      <h2>Customer Management</h2>
      <button onclick="loadData()">Refresh Data</button>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Business</th><th>Email</th><th>Plan</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead>
          <tbody id="customers"></tbody>
        </table>
      </div>
    </div>
    <div id="mainMessage" class="message" role="status"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

async function api(url, options={}) {
  const response = await fetch(url, {
    credentials:'same-origin',
    cache:'no-store',
    ...options,
    headers:{'Content-Type':'application/json', ...(options.headers||{})}
  });
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

function showLogin(message='') {
  $('dashboard').style.display='none';
  $('loginScreen').style.display='block';
  $('logoutButton').style.display='none';
  $('loginMessage').textContent=message;
  $('loginMessage').className='message error';
}

function showDashboard() {
  $('loginScreen').style.display='none';
  $('dashboard').style.display='block';
  $('logoutButton').style.display='inline-block';
  $('loginMessage').textContent='';
}

async function checkAdminSession() {
  try {
    const data=await api('/api/auth/me');
    if (data.user && data.user.role==='admin') {
      showDashboard();
      await loadData();
    } else {
      // Clear any customer session so it cannot be mistaken for an admin session.
      await api('/api/auth/logout',{method:'POST'}).catch(()=>{});
      showLogin('Admin access only. Please use the Super Admin account.');
    }
  } catch {
    showLogin('Please login with your Super Admin email and password.');
  }
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const button=$('loginButton');
  button.disabled=true;
  button.textContent='Signing in...';
  $('loginMessage').textContent='';
  try {
    const body={
      email:$('adminEmail').value.trim(),
      password:$('adminPassword').value
    };
    const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify(body)});
    if (!data.user || data.user.role!=='admin') {
      await api('/api/auth/logout',{method:'POST'}).catch(()=>{});
      throw new Error('Admin access denied. Customer account se Admin Panel nahi khulega.');
    }
    $('adminPassword').value='';
    showDashboard();
    await loadData();
  } catch(error) {
    showLogin(error.message);
  } finally {
    button.disabled=false;
    button.textContent='Admin Login';
  }
});

async function loadData() {
  try {
    $('mainMessage').textContent='Loading...';
    $('mainMessage').className='message';
    const data=await api('/api/admin/overview?_='+Date.now(),{cache:'no-store'});
    if(!data||!Array.isArray(data.customers)) throw new Error('Unexpected response from /api/admin/overview');
    $('total').textContent=data.counts?.customers ?? 0;
    $('active').textContent=data.counts?.active ?? 0;
    $('expired').textContent=data.counts?.expired ?? 0;
    const tbody=$('customers');
    tbody.replaceChildren();

    (data.customers||[]).forEach(customer=>{
      const tr=document.createElement('tr');
      const values=[
        customer.company_name||'',
        customer.email||'',
        customer.plan||'No Plan',
        customer.status||'Inactive',
        customer.ends_at?new Date(customer.ends_at).toLocaleDateString():'-'
      ];
      values.forEach((value,index)=>{
        const td=document.createElement('td');
        if(index===3){
          const badge=document.createElement('span');
          const active=customer.status==='active' && customer.ends_at && Date.parse(customer.ends_at)>Date.now();
          badge.className=active?'badge':'badge expired';
          badge.textContent=value;
          td.appendChild(badge);
        } else td.textContent=value;
        tr.appendChild(td);
      });
      const actions=document.createElement('td');
      actions.className='actions';
      const renew=document.createElement('button');
      renew.textContent='Renew';
      renew.onclick=()=>renewCustomer(customer.tenant_id,customer.plan);
      const suspend=document.createElement('button');
      suspend.textContent='Suspend';
      suspend.className='red';
      suspend.onclick=()=>suspendCustomer(customer.tenant_id);
      actions.append(renew,suspend);
      tr.appendChild(actions);
      tbody.appendChild(tr);
    });
    $('mainMessage').textContent='Updated '+new Date().toLocaleTimeString()+' · '+data.customers.length+' customer(s) loaded';
    $('mainMessage').className='message small';
  } catch(error) {
    $('mainMessage').textContent='Could not load customers: '+error.message;
    $('mainMessage').className='message error';
    if(error.message.toLowerCase().includes('admin') || error.message.toLowerCase().includes('sign in')) {
      showLogin(error.message);
    }
  }
}

$('createForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=$('createButton');
  button.disabled=true;
  const form=new FormData(event.target);
  const body=Object.fromEntries(form.entries());
  body.days=Number(body.days);
  try {
    const result=await api('/api/admin/customers',{method:'POST',body:JSON.stringify(body)});
    $('createMessage').textContent='Customer created successfully: '+result.email;
    $('createMessage').className='message success';
    event.target.reset();
    await loadData();
  } catch(error) {
    $('createMessage').textContent=error.message;
    $('createMessage').className='message error';
  } finally {
    button.disabled=false;
  }
});

async function renewCustomer(tenantId,oldPlan) {
  const plan=prompt('Enter plan: Basic, Professional or Enterprise',oldPlan||'Basic');
  if(!plan)return;
  const days=Number(prompt('Subscription days?','30'));
  if(!Number.isFinite(days)||days<1||days>3660){alert('Invalid days');return;}
  try {
    await api('/api/admin/subscription',{method:'POST',body:JSON.stringify({tenantId,plan,days})});
    alert('Subscription activated successfully.');
    await loadData();
  } catch(error){alert(error.message);}
}

async function suspendCustomer(tenantId) {
  if(!confirm('Suspend this customer?'))return;
  try {
    await api('/api/admin/suspend',{method:'POST',body:JSON.stringify({tenantId})});
    alert('Customer suspended.');
    await loadData();
  } catch(error){alert(error.message);}
}

async function logout() {
  try { await api('/api/auth/logout',{method:'POST'}); }
  finally { showLogin('You have been logged out.'); $('adminPassword').value=''; }
}

checkAdminSession();
</script>
</body>
</html>
